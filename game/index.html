<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cold Archive — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060a; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas#view {
    display: block;
    width: min(100vw, calc(100vh * 1.6923));
    max-height: 100vh;
    aspect-ratio: 1408 / 832;
    box-shadow: 0 0 90px #000, 0 0 0 1px #0d141d;
    cursor: crosshair;
    image-rendering: auto;
  }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 5px;
    text-align: center;
    font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #2f3d4e; letter-spacing: .04em; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="1408" height="832"
    aria-label="Cold Archive, a top-down stealth game. Move with W A S D, crouch with Shift, sprint with Space, interact with E. Reach the green exit without entering a guard's flashlight cone."></canvas>
</div>
<p id="hint">WASD / arrows move · Shift crouch · Space sprint · E interact · R restart level</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
